# kb_food_safety.yaml — 食品安全底线（家庭版）
# 适用家庭：痛风+高血脂老人、幼儿
# 来源：卫健委《按照传统既是食品又是中药材的物质目录》(2002卫法监发51号、2019第8号、2023第9号、2024第4号)
#       国家食品安全风险评估中心(CFSA)、中国疾控中心(CDC)、市场监管总局
# 官方名单汇总页：https://www.nhc.gov.cn/sps/c100088/202311/a7e49f9f0285437b82b842576fa8ede9.shtml
# 生成日期：2026-07-20
#
# 家庭特殊人群提示（非强制字段，供配膳参考）：
#   · 痛风老人：限制高嘌呤(动物内脏、浓肉汤、部分海鲜贝类、啤酒)；急性期禁肉汤/海鲜
#   · 高血脂老人：限动物油、肥肉、糖油混合物；多选药食同源里山楂/荷叶/决明子/茯苓等
#   · 幼儿：严守下方「儿童注意」窒息与年龄红线
#   注：以下毒性/过敏为公认事实，剂量不确定处用定性描述，不编造机制。

法定边界:
  药食同源目录: [丁香, 八角茴香, 刀豆, 小茴香, 小蓟, 山药, 山楂, 马齿苋, 乌梢蛇, 乌梅, 木瓜, 火麻仁, 代代花, 玉竹, 甘草, 白芷, 白果, 白扁豆, 白扁豆花, 龙眼肉(桂圆), 决明子, 百合, 肉豆蔻, 肉桂, 余甘子, 佛手, 杏仁(甜、苦), 沙棘, 牡蛎, 芡实, 花椒, 赤小豆, 阿胶, 鸡内金, 麦芽, 昆布, 枣(大枣、酸枣、黑枣), 罗汉果, 郁李仁, 金银花, 青果, 鱼腥草, 姜(生姜、干姜), 枳椇子, 枸杞子, 栀子, 砂仁, 胖大海, 茯苓, 香橼, 香薷, 桃仁, 桑叶, 桑椹, 桔红, 桔梗, 益智仁, 荷叶, 莱菔子, 莲子, 高良姜, 淡竹叶, 淡豆豉, 菊花, 菊苣, 黄芥子, 黄精, 紫苏, 紫苏籽, 葛根, 黑芝麻, 黑胡椒, 槐米, 槐花, 蒲公英, 蜂蜜, 榧子, 酸枣仁, 鲜白茅根, 鲜芦根, 蝮蛇, 橘皮, 薄荷, 薏苡仁, 薤白, 覆盆子, 藿香, 当归, 山柰, 西红花(藏红花), 草果, 姜黄, 荜茇, 党参, 肉苁蓉(荒漠), 铁皮石斛, 西洋参, 黄芪, 灵芝, 山茱萸, 天麻, 杜仲叶, 地黄, 麦冬, 天冬, 化橘红]
  说明: "卫健委公布的可用于普通食品的药材名单（共106种）；不在名单内的药材不得随意入膳。注：核桃、绿豆等系普通食品，本身即食材，故未列入此药材名单；若作药材使用应遵医嘱。"
  非药食同源禁入膳提示: "以下为仅限药品/保健食品原料或禁用品，不得作普通食材入膳：人参、三七、丹参、天麻以外慎用项；详见 CFSA 保健食品禁用中药名单（如川乌、草乌、生半夏、生南星、马钱子、雷公藤、洋金花、朱砂、雄黄等）。家庭厨房一律不自行添加非名单药材。"

毒性警示:
  - { 食材: 发芽土豆, 风险: 龙葵素(茄碱)中毒, 级别: 禁用, 说明: "芽眼及发青皮肉含龙葵素，须彻底挖除并充分加热；严重发芽或大面积发青整颗丢弃" }
  - { 食材: 鲜黄花菜, 风险: 秋水仙碱, 级别: 须焯水, 说明: "鲜食易中毒，须开水焯烫并清水浸泡去毒，建议改用干品" }
  - { 食材: 野生蘑菇(毒蘑菇), 风险: 鹅膏毒肽/毒蝇碱等多种毒素, 级别: 禁用, 说明: "不采食不明野生菌；剧毒鹅膏菌致死率高，无可靠民间鉴别法" }
  - { 食材: 未煮熟四季豆/扁豆/豇豆, 风险: 皂苷+植物血凝素(红细胞凝集素), 级别: 须煮熟, 说明: "须彻底煮熟焖透至失去生绿色；凉拌须先焯熟，夹生即中毒" }
  - { 食材: 苦杏仁/生桃仁/枇杷仁/李仁, 风险: 氰苷(水解为氢氰酸), 级别: 禁用, 说明: "生食可致氰化物中毒，须充分加热炮制；作药材须遵医嘱，幼儿禁食" }
  - { 食材: 生豆浆, 风险: 胰蛋白酶抑制剂、皂苷, 级别: 须煮熟, 说明: "假沸(约80℃起泡)未熟有毒，须转小火继续煮沸5分钟以上" }
  - { 食材: 河豚(河鲀), 风险: 河豚毒素(TTX)神经麻痹, 级别: 禁用, 说明: "卵巢肝脏含剧毒，耐热无特效解毒药；家庭严禁自行捕捞处理" }
  - { 食材: 织纹螺, 风险: 麻痹性贝类毒素(石房蛤毒素), 级别: 禁用, 说明: "赤潮期富集毒素，加热不分解；国家明令不得经营食用" }
  - { 食材: 青皮红肉鱼(鲐鱼/金枪鱼/鲣鱼), 风险: 组胺(腐败产组胺), 级别: 限量, 说明: "不新鲜时组氨酸转组胺致中毒；须现买现做、冷藏并充分加热，痛风者少食" }
  - { 食材: 变质银耳/久泡木耳/发酵米面, 风险: 椰毒假单胞菌产米酵菌酸, 级别: 禁用, 说明: "变质银耳、久泡木耳、酸汤子等产米酵菌酸，致死率高且无特效药" }
  - { 食材: 鲜白果(银杏), 风险: 银杏毒素(4'-O-甲基吡哆醇,MPN)致惊厥, 级别: 限量, 说明: "婴幼儿禁食；成人熟食不超约10粒/日，忌生食" }
  - { 食材: 苦瓠子(苦葫芦/苦黄瓜), 风险: 葫芦素, 级别: 禁用, 说明: "入口发苦的瓠子、黄瓜含葫芦素，尝苦即吐弃，不可食用" }
  - { 食材: 发霉花生/玉米/坚果, 风险: 黄曲霉毒素(强致癌), 级别: 禁用, 说明: "见霉斑或哈喇味整批丢弃，不可水洗凑合食用" }
  - { 食材: 未成熟青番茄, 风险: 龙葵素, 级别: 禁用, 说明: "青绿色未熟番茄及番茄茎叶含龙葵素，待完全红熟后食用" }
  - { 食材: 鲜木耳, 风险: 卟啉类光敏物质, 级别: 须晒干, 说明: "鲜木耳含卟啉，食后日晒易患日光性皮炎；用干木耳泡发更安全" }
  - { 食材: 生木薯, 风险: 氰苷(氢氰酸), 级别: 须煮熟, 说明: "去皮切片清水浸泡并充分煮熟去毒，禁生食" }
  - { 食材: 蚕豆(蚕豆病/G6PD缺乏者), 风险: 蚕豆嘧啶核苷致急性溶血, 级别: 慎食, 说明: "G6PD缺乏者食后急性溶血；婴幼儿首次食用须密切观察，有家族史者禁" }
  - { 食材: 杨桃, 风险: 草酸及神经毒素(caramboxin), 级别: 限量, 说明: "肾功能不全者食后可能致命抽搐；健康人亦不宜多量，肾病老人禁食" }

儿童注意:
  幼儿_≤3岁:
    禁用: [整粒坚果(窒息), 果冻(窒息), 硬糖(窒息), 整颗葡萄/樱桃番茄(窒息), 爆米花(窒息), 蜂蜜(1岁内肉毒杆菌风险)]
    处理: "坚果磨粉、食物软烂去刺去核、切小块、专人监督进食"
    慎食: [多刺鱼类(卡刺), 年糕/汤圆(黏噎), 高盐加工食品]
  学龄前_3_6岁:
    注意: [果冻仍须切碎, 坚果仍建议碎化, 监督进食防呛]

常见高致敏食材: [海鲜带壳类, 芒果, 鸡蛋, 花生, 牛奶, 大豆, 小麦, 坚果]
家人过敏史: []   # 待用户补充：已知过敏者在此添加，格式 { 成员: , 过敏物: [] }
