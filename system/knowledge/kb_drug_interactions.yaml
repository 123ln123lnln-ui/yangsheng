# kb_drug_interactions.yaml — 药物相互作用红线库（RED / ORANGE / YELLOW）
# 用途：家人换药/加药时自动检测禁忌；配餐与用药提醒的安全闸。
# 来源：均经联网核实（2026-07-20），详见每条 来源 字段。
#   国家医保局 / 中国医药报 / 阜外医院 / 北京协和医院 / 北京友谊医院 / 罗湖医院 /
#   Mayo Clinic / MSD 手册 / 国家药监局(NMPA) / 大医说(dayi.org.cn) / 北京天坛医院药学部
# 重要声明：本库为知识参考，不能替代医师/药师。换药前务必核对药品说明书【禁忌】【药物相互作用】并咨询专业人士。
# 家人实际在用（按用户确认「按示例+慢病扩展」）：拉莫三嗪、他汀类。
#   其余条目为常见慢病药扩展（通用参考），待用户核对真实用药后个体化。

- 药物: 他汀类
  类别: 降脂药（HMG-CoA 还原酶抑制剂）
  绝对禁用: [葡萄柚, 西柚, 柚子及制品, 含西柚/葡萄柚的果汁与果酱]
  注意: [红曲类保健品（含天然洛伐他汀，同理忌西柚）, 酗酒（加重肝损伤）, 与秋水仙碱/贝特类联用肌病风险↑]
  机制: "葡萄柚含呋喃香豆素，强抑 CYP3A4；阿托伐/辛伐/洛伐他汀几乎全靠 CYP3A4 代谢，同服血药浓度升高数倍，横纹肌溶解、急性肾衰竭、肝损伤风险骤增。"
  级别: RED
  来源: "阜外医院：http://www.fuwaihuazhong.cn/article/6107.html ；中国医药报：https://www.cnpharm.com/c/2021-12-22/812880.shtml"

- 药物: 拉莫三嗪
  类别: 抗癫痫药
  绝对禁用: [丙戊酸（联用显著升高拉莫三嗪血药浓度，严重皮疹/Stevens-Johnson 风险↑，须减量并监测）]
  注意: [卡马西平/苯妥英/苯巴比妥/扑米酮/利福平（酶诱导，加速代谢↓疗效）, 口服避孕药（加速代谢↓）, 葡萄柚（影响很小：拉莫三嗪主要经 UGT 葡萄糖醛酸化代谢，非 CYP3A4 主要底物，低优先级监测）]
  机制: "拉莫三嗪主要经 UDP-葡萄糖醛酸转移酶(UGT) 代谢，不经 CYP3A4；与丙戊酸竞争代谢致蓄积，与酶诱导剂合用疗效下降。"
  级别: RED
  来源: "大医说(dayi.org.cn)拉莫三嗪片说明书：https://www.dayi.org.cn/drug/1026743"
  备注: "与初版示例不同：拉莫三嗪并非 CYP3A4 药，葡萄柚非其主要禁忌；真正红线是与丙戊酸等 AED 的相互作用。"

- 药物: 华法林
  类别: 抗凝药（维生素 K 拮抗剂）
  绝对禁用: []
  注意: [富含维生素 K 食物（菠菜/西兰花/羽衣甘蓝/芦笋/纳豆/动物肝脏——须保持每日摄入量稳定，避免骤变）, 葡萄柚汁（抑代谢↑出血）, 蔓越莓汁（↑出血）, 酒精（↑出血）, 人参/银杏/大蒜/生姜/芒果（↑出血）, 圣约翰草（↓药效→血栓风险）]
  机制: "华法林抑制维生素 K 环氧化物还原酶抗凝；维 K 食物抵消药效，葡萄柚/蔓越莓/酒精/活血草药增加出血，圣约翰草诱导代谢降药效。"
  级别: RED
  来源: "Mayo Clinic：https://www.mayoclinic.org/zh-hans/diseases-conditions/deep-vein-thrombosis/in-depth/warfarin-side-effects/art-20047592 ；佛山市一：https://www.fsyyy.com/ArticleDetail.aspx?Columnid=442&id=162701&lcids=0"

- 药物: 左甲状腺素（优甲乐）
  类别: 甲状腺激素替代
  绝对禁用: []
  注意: [豆制品（豆浆/豆腐，间隔≥4h）, 乳制品/高钙食物（间隔≥4h）, 铁剂（间隔≥4h，吸收↓40-60%）, 高纤维食物（间隔2-4h）, 咖啡/浓茶（间隔≥1h）, 葡萄柚（抑 CYP3A4↑血药浓度）]
  机制: "钙/铁/大豆蛋白/纤维素与左甲状腺素形成不溶物或吸附，显著降低肠道吸收；咖啡加速代谢；葡萄柚抑制代谢致蓄积。"
  级别: ORANGE
  来源: "四川省肿瘤医院：https://www.sichuancancer.org/info/1572/11751.htm"

- 药物: 钙通道阻滞剂（地平类降压药）
  类别: 降压药（二氢吡啶类：氨氯地平/非洛地平/硝苯地平）
  绝对禁用: [葡萄柚, 西柚, 柚子及制品]
  注意: [橙/橘/苹果等低呋喃香豆素水果通常安全, 与他汀联用叠加 CYP3A4 影响]
  机制: "地平类主要经 CYP3A4 代谢；西柚抑酶致血药浓度升高 2-5 倍，血压骤降、头晕/乏力/心悸，甚至心绞痛/卒中。"
  级别: RED
  来源: "39 健康：https://mip.39yst.com/ask/7304371.shtml"

- 药物: 秋水仙碱
  类别: 抗痛风药（急性发作）
  绝对禁用: [克拉霉素等强 CYP3A4 抑制剂（大环内酯类抗生素）, 葡萄柚汁]
  注意: [他汀类降脂药（联用肌病/横纹肌溶解风险↑）, 维拉帕米（P-gp 抑制↑）, 环孢素, 贝特类, 维生素 B6（降效）]
  机制: "秋水仙碱是 CYP3A4 与 P-糖蛋白(P-gp) 底物；强抑制剂（克拉霉素/葡萄柚）使其血药浓度剧升，可致中毒、骨髓抑制、横纹肌溶解，甚至致死。"
  级别: RED
  来源: "国家药监局 NMPA 说明书修订：https://www.nmpa.gov.cn/ ；大医说：https://www.dayi.org.cn/drug/1025848"

- 药物: 甲硝唑/替硝唑/奥硝唑
  类别: 硝基咪唑类抗菌药
  绝对禁用: [酒精及含酒精食物药物（酒/酒酿/藿香正气水/十滴水/酒心巧克力等）]
  注意: [停药后仍需禁酒 3-5 天（双硫仑样反应窗口）]
  机制: "硝基咪唑类强抑乙醛脱氢酶，与乙醇同服致乙醛蓄积→双硫仑样反应（面红/心悸/呼吸困难/休克），反应常比头孢更剧烈。"
  级别: RED
  来源: "北京协和医院：https://www.pumch.cn/detail/34731.html ；腾讯新闻：https://new.qq.com/rain/a/20260518A05IOI00"

- 药物: 环孢素/他克莫司
  类别: 免疫抑制剂（CYP3A4/P-gp 底物）
  绝对禁用: [葡萄柚, 西柚, 石榴, 番石榴（槲皮素抑 CYP3A4）, 杨桃（肾毒/高钾）]
  注意: [圣约翰草（↓药效→排斥）, 红葡萄酒（白藜芦醇↑浓度）, 高钾水果（环孢素本身致高钾）]
  机制: "环孢素/他克莫司为 CYP3A4 与 P-gp 底物；西柚汁可使其血药浓度升高 2-3 倍（肾/神经毒性），石榴/番石榴含槲皮素同理，杨桃含草酸盐与神经毒素伤肾。"
  级别: RED
  来源: "北京友谊医院：https://www.cn-healthcare.com/api/third/article/1388828 ；罗湖医院：https://www.szlhyy.com.cn/info/1140/10777.htm"

- 药物: 喹诺酮类抗生素（左氧氟沙星/诺氟沙星/环丙沙星/莫西沙星）
  类别: 抗菌药
  绝对禁用: []
  注意: [乳制品/含钙果汁（牛奶/酸奶/奶酪，间隔≥2h，钙螯合↓吸收 50%+）, 含铝镁铁钙的制剂, 咖啡因（喹诺酮增强咖啡因→头痛/失眠/焦虑）, NSAIDs（癫痫风险↑）]
  机制: "喹诺酮与钙镁铁锌形成不溶络合物降低吸收；增强咖啡因中枢兴奋；与非甾体抗炎药合用增加惊厥风险。"
  级别: ORANGE
  来源: "飞华健康：https://www.fh21.com.cn/article/view/b7t1t6vz6k3bnah.html ；河南广电：https://www.hntv.tv/rhh-9678793728/article/1/1740671121018544129"

- 药物: 四环素类（多西环素/米诺环素）
  类别: 抗菌药
  绝对禁用: []
  注意: [乳制品/钙剂/铁剂（间隔≥2h）, 含钙果汁]
  机制: "四环素与钙/镁/铁形成不溶性复合物，生物利用度下降 50-90%，抗感染失败。"
  级别: ORANGE
  来源: "飞华健康：https://www.fh21.com.cn/article/view/b7t1t6vz6k3bnah.html"

- 药物: 地高辛
  类别: 强心苷（心衰/房颤）
  绝对禁用: [圣约翰草]
  注意: [高纤维食物/豆制品（↓吸收）, 钙剂（↓）, 胺碘酮/维拉帕米/奎尼丁（血药浓度↑中毒）]
  机制: "圣约翰草诱导 P-gp/代谢酶，使地高辛血药浓度↓至无效（危险）；高纤/大豆/钙干扰吸收。"
  级别: RED
  来源: "Mayo Clinic 圣约翰草：https://www.mayoclinic.org/zh-hans/drugs-supplements-st-johns-wort/art-20362212"

- 药物: ACEI/ARB 类降压药（普利类/沙坦类）
  类别: 降压药
  绝对禁用: []
  注意: [高钾食物（香蕉/橙子/土豆/菌菇，肾功能不全者↑高钾风险）, 西柚（沙坦类轻微影响，谨慎）, 甘草（影响电解质）]
  机制: "ACEI/ARB 减少醛固酮→保钾；肾功能不全时高钾食物可致高钾血症；沙坦类部分经 CYP3A4 受西柚轻微影响。"
  级别: ORANGE
  来源: "综合临床用药须知（Mayo/UpToDate 用药交互原则）"

- 药物: 排钾利尿剂（氢氯噻嗪/呋塞米）
  类别: 降压药/利尿
  绝对禁用: []
  注意: [甘草（↑排钾→低钾）, 胡萝卜（加速排钾）, 宜搭配高钾果蔬（香蕉/橙子/土豆）]
  机制: "排钾利尿剂增加尿钾排出；甘草/胡萝卜进一步排钾致低血钾（乏力/心律失常）；需补钾食物平衡。"
  级别: YELLOW
  来源: "北京天坛医院药学部科普：https://weibo.com/ttarticle/p/show?id=2309404980353055195281"

- 药物: 二甲双胍
  类别: 降糖药（双胍类）
  绝对禁用: []
  注意: [大量酒精（乳酸酸中毒/低血糖风险↑，服药期间避免酗酒）]
  机制: "酒精抑制肝糖原异生并增强降糖，与二甲双胍叠加可致低血糖与乳酸酸中毒。"
  级别: ORANGE
  来源: "中国医药报饮酒间隔：https://m.cnpharm.com/c/2026-01-27/1089956.shtml"

- 药物: 磺脲类降糖药（格列本脲/格列美脲/格列齐特）
  类别: 降糖药
  绝对禁用: [酒精]
  注意: [空腹饮酒→严重低血糖昏迷（症状似醉酒易延误抢救）]
  机制: "磺脲促胰岛素分泌；酒精阻断肝糖输出并增强降糖，叠加致致命性低血糖。"
  级别: RED
  来源: "武汉大学人民医院：https://www.rmhospital.com/article/id/15717.html"

- 药物: 阿仑膦酸钠（双膦酸盐）
  类别: 抗骨质疏松
  绝对禁用: []
  注意: [乳制品/钙剂/高钙食物（间隔≥2h，↓吸收）, 咖啡（↓吸收）, 须空腹直立服、30min 内不进食/不平卧]
  机制: "双膦酸盐与钙/多价阳离子螯合，生物利用度显著下降；咖啡亦降低吸收。"
  级别: ORANGE
  来源: "北大人民营养科：https://g.fh21.com.cn/article/view/2u051z06ktz4dcw.html"

- 药物: 阿司匹林/布洛芬/萘普生（NSAIDs）
  类别: 解热镇痛/抗血小板
  绝对禁用: [酒精（胃出血风险）]
  注意: [与华法林联用出血风险↑, 与喹诺酮联用癫痫风险↑, 对乙酰氨基酚+酒→肝损]
  机制: "NSAIDs 刺激胃黏膜，酒精双重损伤→消化道出血/溃疡；与抗凝药协同出血；与喹诺酮增加惊厥。"
  级别: RED
  来源: "瑞金医院：https://www.rjh.com.cn/2018RJPortal/doc/2020/02/12/46769.shtml"

- 药物: SSRI 类抗抑郁药（氟西汀/舍曲林/帕罗西汀）
  类别: 抗抑郁药
  绝对禁用: [圣约翰草（5-羟色胺综合征风险）, MAOI 类]
  注意: [酒精（↑镇静/肝损）, 与曲普坦类（偏头痛药）联用 5-羟色胺↑]
  机制: "SSRI 与圣约翰草/曲普坦/MAOI 叠加 5-羟色胺能，可致 5-羟色胺综合征（高热/抽搐/意识改变）；酒精加重中枢抑制。"
  级别: RED
  来源: "MSD 手册圣约翰草：https://www.msdmanuals.cn/home/special-subjects/dietary-supplements/st-john’s-wort"

- 药物: 苯二氮䓬类（地西泮/艾司唑仑/咪达唑仑）
  类别: 镇静催眠/抗焦虑
  绝对禁用: [酒精（呼吸抑制/死亡）, 西柚（↑镇静时间）]
  注意: [阿片类（呼吸抑制叠加）]
  机制: "酒精与苯二氮䓬协同中枢抑制→昏迷/呼吸停止；西柚抑 CYP3A4 延长地西泮作用。"
  级别: RED
  来源: "中国医药报：https://m.cnpharm.com/c/2026-01-27/1089956.shtml"

- 药物: 别嘌醇/非布司他
  类别: 降尿酸药（痛风长期）
  绝对禁用: []
  注意: [酒精（诱发痛风/↑尿酸）, 高嘌呤饮食（动物内脏/浓肉汤/部分海鲜）, 与噻嗪类利尿剂联用↑皮疹风险]
  机制: "酒精抑制尿酸排泄并促生成；高嘌呤饮食抵消降尿酸疗效；别嘌醇与利尿剂合用严重皮疹风险↑。"
  级别: ORANGE
  来源: "综合痛风诊疗指南（NMPA 说明书交互原则）"

- 药物: 苯溴马隆
  类别: 促尿酸排泄药（痛风长期）
  绝对禁用: [水杨酸类（阿司匹林等，拮抗排尿酸作用）]
  注意: [肾功能不全者（eGFR<20禁用）, 肾结石/尿酸性肾病慎用, 饮酒（↓疗效+↑肝损）]
  机制: "抑制肾小管尿酸重吸收促排泄；水杨酸类阻断此作用；需多饮水（日>2000ml）防尿酸结晶。"
  级别: RED
  来源: "NMPA 苯溴马隆说明书 + 痛风诊疗指南"

- 药物: 碳酸氢钠
  类别: 碱化尿液药（痛风辅助）
  绝对禁用: []
  注意: [与牛奶/乳制品同服（可能乳碱综合征，间隔>2h）, 与大量含钙食物同服, 充血性心衰/高血压（钠负荷↑）, 与抗胆碱药（↓疗效）]
  机制: "碱化尿液促尿酸溶解排出；含钠量高(1g≈12mEq Na⁺)，心血管患者须计算钠负荷。"
  级别: YELLOW
  来源: "NMPA 碳酸氢钠说明书 + 临床用药须知"
