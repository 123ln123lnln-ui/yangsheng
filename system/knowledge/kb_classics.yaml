# ========== ③ 饮膳正要·食谱 ==========
yinshan_zhengyao:
  - 春季: 枸杞叶猪肝汤
  - 夏季: 绿豆百合粥
  - 秋季: 银耳莲子羹
  - 冬季: 当归生姜羊肉汤
  - 全年: 四神汤（茯苓+山药+莲子+芡实）
