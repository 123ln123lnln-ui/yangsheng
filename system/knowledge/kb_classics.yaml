# 经典古籍库 — 古法养生知识根基
# 来源：黄帝内经、本草纲目、饮膳正要、随息居饮食谱

# ========== ① 黄帝内经·四季调神 ==========
huangdi_neijing:
  seasonal:
    春:
      原文: "春三月，此谓发陈。夜卧早起，广步于庭，被发缓形，以使志生"
      原则: 养阳疏肝
      作息: 晚睡早起（不晚于23:00）
      情绪: 戒怒
      饮食: 省酸增甘，以养脾气
    夏:
      原文: "夏三月，此谓蕃秀。夜卧早起，无厌于日，使志无怒"
      原则: 养心清暑
      作息: 晚睡早起 + 午休
      情绪: 忌烦躁
      饮食: 省苦增辛，以养肺气
    秋:
      原文: "秋三月，此谓容平。早卧早起，与鸡俱兴，使志安宁"
      原则: 养肺润燥
      作息: 早睡早起
      情绪: 收敛神气
      饮食: 省辛增酸，以养肝气
    冬:
      原文: "冬三月，此谓闭藏。早卧晚起，必待日光，使志若伏若匿"
      原则: 养肾藏精
      作息: 早睡晚起（待日出）
      情绪: 含藏不露
      饮食: 省咸增苦，以养心气

  # ② 十二时辰子午流注
  shichen:
    卯时: { 时间: "5:00-7:00", 经络: 大肠经, 宜: "晨起一杯温水、排便", 忌: "赖床憋便" }
    辰时: { 时间: "7:00-9:00", 经络: 胃经, 宜: "早餐吃好，温热易消化", 忌: "空腹、冷食" }
    巳时: { 时间: "9:00-11:00", 经络: 脾经, 宜: "饮温水，适度活动", 忌: "久坐伤脾" }
    午时: { 时间: "11:00-13:00", 经络: 心经, 宜: "午休15-30分钟养心", 忌: "剧烈运动、暴怒" }
    未时: { 时间: "13:00-15:00", 经络: 小肠经, 宜: "午餐细嚼慢咽", 忌: "饭后即卧" }
    申时: { 时间: "15:00-17:00", 经络: 膀胱经, 宜: "多喝水、适度活动", 忌: "憋尿" }
    酉时: { 时间: "17:00-19:00", 经络: 肾经, 宜: "晚餐宜少，补肾气", 忌: "过咸伤肾" }
    戌时: { 时间: "19:00-21:00", 经络: 心包经, 宜: "散步、放松心情", 忌: "情绪激动" }
    亥时: { 时间: "21:00-23:00", 经络: 三焦经, 宜: "泡脚、入睡准备", 忌: "熬夜、刷手机" }

  # ③ 五运六气（年度更新）
  yunqi:
    2026丙午年:
      岁运: 水运太过
      司天: 少阴君火
      在泉: 阳明燥金
      年度提示: "水火交争之年，注意心肾不交、失眠上火，宜滋阴降火、交通心肾"

