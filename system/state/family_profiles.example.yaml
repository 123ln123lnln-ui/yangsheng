# 家庭成员档案（示例模板）
# 用法：复制为 state/family_profiles.yaml 并填入自己的信息
# ⚠️ family_profiles.yaml 已在 .gitignore 中，真实档案不会被提交
members:
  - id: m1
    name: M1            # 用代号即可，不必写真名
    role: 本人
    age: 0
    constitution: ""    # 体质，如 痰湿质
    concerns: []        # 健康关注点
    medications: []     # 在服药物（用于药物相互作用检查）
    allergies: []
    taboos: []
    goals: []
    sleep_notes: ""
    notes: ""
  # - id: m2 ... 按需增加成员
global_rules:
  drug_interactions: []   # 例：- alert: "他汀 + 西柚"  reason: "CYP3A4抑制"  level: high
  safety: []
  weather_triggers: []    # 例：- condition: "降温"  mode: "驱寒"  force_recommend: []  force_avoid: []
